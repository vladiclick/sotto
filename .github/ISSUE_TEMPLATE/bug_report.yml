name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.1, MacBook Air M4
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Sotto version, model and language
      placeholder: 0.1.0, Large v3 Turbo, Auto-detect
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The relevant lines from ~/Library/Logs/Sotto/sotto.log (it never contains what you said).
      render: text
